<script>
  (function () {
    function showUpdateBanner(onRefresh) {
      if (document.getElementById("update-banner")) return;
      const bar = document.createElement("div");
      bar.id = "update-banner";
      bar.style.cssText =
        "position:fixed;left:0;right:0;bottom:0;z-index:9999;" +
        "background:#f59e0b;color:#09090b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;" +
        "padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;" +
        "box-shadow:0 -4px 16px rgba(0,0,0,0.35);direction:rtl;font-size:14px;font-weight:600;";
      bar.innerHTML =
        '<span>יש גרסה חדשה זמינה</span>' +
        '<button id="update-banner-btn" style="background:#09090b;color:#f59e0b;border:none;' +
        'border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;">רענן עכשיו</button>';
      document.body.appendChild(bar);
      document.getElementById("update-banner-btn").addEventListener("click", onRefresh);
    }

    const CURRENT_VERSION = window.__APP_VERSION__ || "";
    let checking = false;

    async function checkForUpdate() {
      if (checking || document.getElementById("update-banner")) return;
      checking = true;
      try {
        const res = await fetch("./index.html", { cache: "no-store" });
        const text = await res.text();
        const match = text.match(/__APP_VERSION__\s*=\s*"([^"]+)"/);
        const remoteVersion = match ? match[1] : null;
        if (remoteVersion && CURRENT_VERSION && remoteVersion !== CURRENT_VERSION) {
          showUpdateBanner(() => window.location.reload());
        }
      } catch (e) {
        // offline or network error — ignore, try again later
      } finally {
        checking = false;
      }
    }

    window.addEventListener("load", () => {
      checkForUpdate();
      setInterval(checkForUpdate, 60000); // re-check every minute while open
    });
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) checkForUpdate();
    });
  })();
</script>
